name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: SDK and CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.11.0", "24"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: ${{ matrix.node }}
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run verify
      - run: vp run example:check
      - run: vp exec node dist/cli.js check examples/clients.ts
      - run: vp exec node dist/cli.js check examples/proxies.ts
      - run: vp exec node dist/cli.js check examples/rule-sets.ts
      - name: Exercise CLI build with example credentials
        run: |
          vp run example:build
          vp exec node dist/cli.js build examples/clients.ts --out out/clients
          vp exec node dist/cli.js build examples/proxies.ts --out out/proxies
          vp exec node dist/cli.js build examples/rule-sets.ts --out out/rule-sets
        env:
          DEMO_USER: example-user
          DEMO_PASSWORD: example-only
          DEMO_UUID: 11111111-2222-4333-8444-555555555555
  sing-box:
    name: sing-box ${{ matrix.version }} native check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.11.0"
            sha256: "eff0237951bfbd2381be36f114e419f10d3ed57dbf929f680e4cc9f57e319d64"
          - version: "1.12.0"
            sha256: "f59b1253ae0143997cb46915af30d14a33431dcbd7e39edacfcde8d73050faaf"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: "24"
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Prepare pinned sing-box checker
        shell: bash
        env:
          SING_BOX_VERSION: ${{ matrix.version }}
          SING_BOX_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p .cache/native
          curl --fail --location --retry 3 --output .cache/native/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  .cache/native/sing-box.tar.gz" | sha256sum --check
          tar -xzf .cache/native/sing-box.tar.gz -C .cache/native "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          mv ".cache/native/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" ".cache/native/sing-box-${SING_BOX_VERSION}"
      - name: Check generated configurations without starting the proxy
        run: vp test run test/native.test.ts test/dns-native.test.ts -t "sing-box $SING_BOX_VERSION"
        env:
          SING_BOX_VERSION: ${{ matrix.version }}
          PROXYLANG_NATIVE_CHECK: "1"
  mihomo:
    name: Mihomo 1.19.32 native check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: "24"
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Prepare pinned Mihomo checker
        shell: bash
        run: |
          mkdir -p .cache/native
          curl --fail --location --retry 3 --output .cache/native/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz
          echo "306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc  .cache/native/mihomo.gz" | sha256sum --check
          gzip -dc .cache/native/mihomo.gz > .cache/native/mihomo-1.19.32
          chmod +x .cache/native/mihomo-1.19.32
      - run: vp test run test/native.test.ts -t Mihomo
        env:
          PROXYLANG_NATIVE_CHECK: "1"
  contracts:
    name: Concord contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: "24"
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install verified Concord release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/concord.tgz" https://github.com/CorrectRoadH/Concord/releases/download/v0.14.1/concord-sdlc-0.14.1.tgz
          echo "818ac89e9026a4e545783301cb0da63bed97fd565a1c3759b072504e3386fdb4  $RUNNER_TEMP/concord.tgz" | sha256sum --check
          vp exec npm install --prefix "$RUNNER_TEMP/concord-tool" --no-audit --no-fund "$RUNNER_TEMP/concord.tgz"
          echo "$RUNNER_TEMP/concord-tool/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp run docs:check
      - run: vp run docs:gaps
      - run: concord doctor --json
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
