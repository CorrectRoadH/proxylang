name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: SDK and CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: ${{ matrix.node }}
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run example:check
      - name: Exercise CLI build with example credentials
        run: vp run example:build
        env:
          DEMO_USER: example-user
          DEMO_PASSWORD: example-only
  contracts:
    name: Concord contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          version: "1.3.0"
          node-version: "24"
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install verified Concord release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/concord.tgz" https://github.com/CorrectRoadH/Concord/releases/download/v0.11.8/concord-sdlc-0.11.8.tgz
          echo "e2daa3ff6b1ca21c01df7144f0ab9400d2323a7083b3d610aa63a122fdc1918b  $RUNNER_TEMP/concord.tgz" | sha256sum --check
          vp exec npm install --prefix "$RUNNER_TEMP/concord-tool" --no-audit --no-fund "$RUNNER_TEMP/concord.tgz"
          echo "$RUNNER_TEMP/concord-tool/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp run docs:check
      - run: vp run docs:gaps
      - run: concord doctor --json
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
