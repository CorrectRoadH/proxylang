proxies:
  - name: edge
    type: trojan
    server: 192.0.2.10
    port: 443
    password: test-only
    sni: proxy.example.com
    udp: true
proxy-groups: []
rules:
  - RULE-SET,external,DIRECT
  - DOMAIN-SUFFIX,example.com,edge
  - MATCH,edge
rule-providers:
  external:
    type: http
    url: https://rules.example.com/list.yaml
    path: rule-providers/pl-external.yaml
    interval: 86400
    behavior: domain
    format: yaml
    proxy: DIRECT
