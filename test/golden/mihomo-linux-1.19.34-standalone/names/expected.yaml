proxies:
  - name: Edge Example
    type: trojan
    server: 192.0.2.10
    port: 443
    password: test-only
    sni: proxy.example.com
    udp: true
  - name: Chained Example
    type: http
    server: 192.0.2.20
    port: 8080
    dialer-proxy: Route Choice
    password: test-only
proxy-groups:
  - name: Route Choice
    type: select
    proxies:
      - Edge Example
rules:
  - DOMAIN,choice.example,Route Choice
  - NETWORK,tcp,Chained Example
  - DOMAIN-SUFFIX,example.com,Edge Example
  - MATCH,Edge Example
mixed-port: 16900
allow-lan: false
bind-address: 127.0.0.1
mode: rule
ipv6: false
geo-auto-update: false
sniffer:
  enable: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 192.0.2.53
  default-nameserver:
    - 192.0.2.53
  respect-rules: false
  use-hosts: false
  use-system-hosts: false
