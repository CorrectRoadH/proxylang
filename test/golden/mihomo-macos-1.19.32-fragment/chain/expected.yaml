proxies:
  - name: edge
    type: trojan
    server: 192.0.2.10
    port: 443
    password: test-only
    sni: proxy.example.com
    udp: true
  - name: chained
    type: http
    server: 192.0.2.20
    port: 8080
    dialer-proxy: edge
    password: test-only
proxy-groups: []
rules:
  - DOMAIN-SUFFIX,example.com,edge
  - NETWORK,tcp,chained
  - MATCH,edge
