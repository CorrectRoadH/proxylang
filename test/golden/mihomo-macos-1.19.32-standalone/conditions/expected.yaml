proxies:
  - name: edge
    type: trojan
    server: 192.0.2.10
    port: 443
    password: test-only
    sni: proxy.example.com
    udp: true
proxy-groups: []
rules:
  - DOMAIN-SUFFIX,example.com,edge
  - DOMAIN,one.example,DIRECT
  - DOMAIN-SUFFIX,two.example,DIRECT
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
  - IP-CIDR6,2001:db8::/32,DIRECT,no-resolve
  - DST-PORT,80,DIRECT
  - NETWORK,udp,DIRECT
  - AND,((DOMAIN,three.example),(NOT,((DST-PORT,443)))),DIRECT
  - OR,((DST-PORT,123),(DST-PORT,456)),DIRECT
  - SRC-IP-CIDR,192.0.2.21/32,DIRECT
  - SRC-PORT,2000-2005,DIRECT
  - DST-PORT,4000-4010,DIRECT
  - PROCESS-NAME,example-app,DIRECT
  - MATCH,edge
mixed-port: 16900
allow-lan: false
bind-address: 127.0.0.1
mode: rule
ipv6: false
geo-auto-update: false
sniffer:
  enable: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 192.0.2.53
  default-nameserver:
    - 192.0.2.53
  respect-rules: false
  use-hosts: false
  use-system-hosts: false
