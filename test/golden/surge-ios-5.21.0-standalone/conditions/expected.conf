[General]
loglevel = notify
dns-server = 192.0.2.53

[Host]

[Proxy]
edge = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true

[Proxy Group]

[Rule]
DOMAIN-SUFFIX,example.com,edge
DOMAIN,one.example,DIRECT
DOMAIN-SUFFIX,two.example,DIRECT
IP-CIDR,192.0.2.0/24,DIRECT
IP-CIDR6,2001:db8::/32,DIRECT
DEST-PORT,80,DIRECT
PROTOCOL,UDP,DIRECT
AND,((DOMAIN,three.example),(NOT,((DEST-PORT,443)))),DIRECT
OR,((DEST-PORT,123),(DEST-PORT,456)),DIRECT
SRC-IP,192.0.2.21,DIRECT
SRC-PORT,2000-2005,DIRECT
DEST-PORT,4000-4010,DIRECT
IP-ASN,64512,DIRECT,no-resolve
FINAL,edge
