[General]
loglevel = notify
dns-server = 192.0.2.53

[Host]

[Proxy]
edge = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true
tunnel = tailscale, section-name=ExampleMesh
wireguard = wireguard, section-name=ExampleWire

[Tailscale ExampleMesh]
auth-key = test-only
hostname = test-device

[WireGuard ExampleWire]
private-key = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
self-ip = 192.0.2.2
peer = (public-key = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=, preshared-key = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=, allowed-ips = "192.0.2.0/24", endpoint = edge.example.com:51820, keepalive = 25)

[Proxy Group]

[Rule]
DOMAIN,mesh.example,tunnel
DOMAIN,wire.example,wireguard
DOMAIN-SUFFIX,example.com,edge
FINAL,edge
