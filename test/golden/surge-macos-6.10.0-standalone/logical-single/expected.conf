[General]
loglevel = notify
dns-server = 192.0.2.53

[Host]

[Proxy]
edge = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true

[Proxy Group]

[Rule]
DOMAIN-SUFFIX,example.com,edge
AND,((IP-CIDR,192.0.2.0/24)),DIRECT
OR,((DOMAIN,single.example)),DIRECT
NOT,((AND,((DEST-PORT,443)))),DIRECT
