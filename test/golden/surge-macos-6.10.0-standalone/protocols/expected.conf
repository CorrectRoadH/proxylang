[General]
loglevel = notify
dns-server = 192.0.2.53

[Host]

[Proxy]
edge = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true
http = http, 192.0.2.11, 8080, username=test-only, password=test-only
anytls = anytls, 192.0.2.12, 443, password=test-only
hy2 = hysteria2, 192.0.2.13, 443, password=test-only, port-hopping=443;40000-40010, port-hopping-interval=30
ss-0 = ss, 192.0.2.14, 8388, encrypt-method=aes-128-gcm, password=test-only, udp-relay=true, block-quic=off
ss-1 = ss, 192.0.2.14, 8388, encrypt-method=aes-256-gcm, password=test-only, udp-relay=true, block-quic=off
ss-2 = ss, 192.0.2.14, 8388, encrypt-method=chacha20-ietf-poly1305, password=test-only, udp-relay=true, block-quic=off
vmess-tcp = vmess, 192.0.2.15, 443, username=11111111-2222-4333-8444-555555555555, vmess-aead=true, encrypt-method=aes-128-gcm, tls=true, sni=tls.example.com
vmess-ws = vmess, 192.0.2.15, 443, username=11111111-2222-4333-8444-555555555555, vmess-aead=true, encrypt-method=aes-128-gcm, tls=true, sni=tls.example.com, ws=true, ws-path=/proxy, ws-headers=Host:ws.example.com

[Proxy Group]

[Rule]
DOMAIN-SUFFIX,example.com,edge
AND,((PROTOCOL,TCP),(DEST-PORT,1000)),http
AND,((PROTOCOL,TCP),(DEST-PORT,1001)),anytls
AND,((PROTOCOL,TCP),(DEST-PORT,1002)),hy2
AND,((PROTOCOL,TCP),(DEST-PORT,1003)),ss-0
AND,((PROTOCOL,TCP),(DEST-PORT,1004)),ss-1
AND,((PROTOCOL,TCP),(DEST-PORT,1005)),ss-2
AND,((PROTOCOL,TCP),(DEST-PORT,1006)),vmess-tcp
AND,((PROTOCOL,TCP),(DEST-PORT,1007)),vmess-ws
FINAL,edge
