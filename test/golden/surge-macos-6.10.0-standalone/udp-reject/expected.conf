[General]
loglevel = notify
dns-server = 192.0.2.53
udp-policy-not-supported-behaviour = REJECT

[Host]

[Proxy]
edge = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true
http = http, 192.0.2.30, 8080, password=test-only

[Proxy Group]
mixed = select, edge, http

[Rule]
DOMAIN-SUFFIX,example.com,edge
DOMAIN,udp.example,http
DOMAIN,mixed.example,mixed
FINAL,mixed
