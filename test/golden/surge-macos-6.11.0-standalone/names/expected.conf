[General]
loglevel = notify
dns-server = 192.0.2.53

[Host]

[Proxy]
Edge Example = trojan, 192.0.2.10, 443, password=test-only, sni=proxy.example.com, udp-relay=true
Chained Example = http, 192.0.2.20, 8080, password=test-only, underlying-proxy=Route Choice
Mesh Example = tailscale, section-name=NamedMesh

[Tailscale NamedMesh]
auth-key = test-only
hostname = example-device

[Proxy Group]
Route Choice = select, Edge Example

[Rule]
DOMAIN,mesh.example,Mesh Example
DOMAIN,choice.example,Route Choice
PROTOCOL,TCP,Chained Example
DOMAIN-SUFFIX,example.com,Edge Example
FINAL,Edge Example
